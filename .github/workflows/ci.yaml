name: CI - Build Check

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Nucleus
        uses: kdroidFilter/Nucleus/.github/actions/setup-nucleus@789704a9b63c5b2a0ff4d6e1cd85711ab2e4286b

      - name: Run ktlint
        run: ./gradlew ktlintCheck --no-daemon

  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Build website
        working-directory: website
        run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Nucleus
        uses: kdroidFilter/Nucleus/.github/actions/setup-nucleus@789704a9b63c5b2a0ff4d6e1cd85711ab2e4286b

      - name: Run tests with coverage
        run: ./gradlew :SeforimApp:jvmTest :SeforimApp:koverXmlReport :SeforimApp:koverHtmlReport --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: |
            **/build/reports/kover/
          retention-days: 7

  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64 (DEB)
          - os: ubuntu-latest
            arch: amd64
            build_task: ":SeforimApp:packageGraalvmDeb"
            graalvm: true

          # Windows x64 (JBR, matching the portable runtime; PDFBox rendering uses AWT)
          - os: windows-latest
            arch: amd64
            build_task: ":SeforimApp:createReleaseDistributable :SeforimApp:packageReleaseNsis"
            graalvm: false
            rust_target: x86_64-pc-windows-msvc

          # Windows ARM64 (JBR - no Liberica NIK)
          - os: windows-11-arm
            arch: arm64
            build_task: ":SeforimApp:createReleaseDistributable :SeforimApp:packageReleaseNsis"
            graalvm: false
            rust_target: aarch64-pc-windows-msvc

          # macOS Apple Silicon (ARM64)
          - os: macos-26
            arch: arm64
            build_task: ":SeforimApp:packageReleaseDmg"
            graalvm: false

    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Cache electron-builder toolsets
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: ~/.cache/electron-builder
          key: electron-builder-${{ runner.os }}-${{ runner.arch }}-26.15.3

      - name: Setup Nucleus
        uses: kdroidFilter/Nucleus/.github/actions/setup-nucleus@789704a9b63c5b2a0ff4d6e1cd85711ab2e4286b
        with:
          graalvm: ${{ matrix.graalvm }}
          jbr-version: '25.0.3b496.62'

      # Build
      - name: Build
        run: ./gradlew ${{ matrix.build_task }} --no-daemon
        shell: bash

      # Upload Artifacts
      - name: Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: linux-deb-${{ matrix.arch }}
          path: SeforimApp/build/compose/binaries/main/graalvm-deb/*.deb
          if-no-files-found: error

      - name: Upload Windows .exe installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: windows-exe-${{ matrix.arch }}
          path: |
            SeforimApp/build/compose/binaries/main/graalvm-nsis/*.exe
            SeforimApp/build/compose/binaries/main-release/nsis/*.exe
          if-no-files-found: error

      - name: Upload macOS .dmg
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v6
        with:
          name: macos-dmg-${{ matrix.arch }}
          path: |
            SeforimApp/build/compose/binaries/main/graalvm-dmg/*.dmg
            SeforimApp/build/compose/binaries/main-release/dmg/*.dmg
          if-no-files-found: error

      - name: Upload packaging diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: packaging-diagnostics-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            SeforimApp/build/compose/logs/**
            SeforimApp/build/compose/tmp/*.args.txt
          if-no-files-found: ignore
