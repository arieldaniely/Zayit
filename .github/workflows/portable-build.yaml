name: Portable Windows build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - work
    paths:
      - 'SeforimApp/**'
      - 'SeforimLibrary/**'
      - 'gradle/**'
      - '*.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/portable-build.yaml'

jobs:
  portable-windows:
    name: Build portable Windows distribution
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build portable app directory
        run: .\gradlew.bat --no-daemon :SeforimApp:createDistributable

      - name: Stage portable Windows layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $portableRoot = 'portable-zayita-windows'
          $appDir = 'SeforimApp/build/compose/binaries/main/app'
          if (-not (Test-Path $appDir -PathType Container)) {
            throw "Compose app directory was not found: $appDir"
          }

          New-Item -ItemType Directory -Force -Path $portableRoot | Out-Null
          Copy-Item -Path (Join-Path $appDir '*') -Destination $portableRoot -Recurse -Force

          $zayitaRoot = Join-Path $portableRoot 'zayita'
          New-Item -ItemType Directory -Force -Path (Join-Path $zayitaRoot 'data/databases') | Out-Null
          New-Item -ItemType File -Force -Path (Join-Path $zayitaRoot 'zayita.portable') | Out-Null

          @'
          זיתא - מהדורה ניידת ל-Windows

          כל נתוני המשתמש ומסדי הנתונים נשמרים בתיקיית data שליד התוכנה.
          ניתן להפעיל גם עם ZAYITA_PORTABLE=1 או עם ‎-Dzayita.portable=true.
          '@ | Set-Content -Path (Join-Path $zayitaRoot 'README-portable.txt') -Encoding UTF8

          Compress-Archive -Path (Join-Path $portableRoot '*') -DestinationPath 'zayita-portable-windows.zip' -Force

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: zayita-portable-windows
          path: zayita-portable-windows.zip
